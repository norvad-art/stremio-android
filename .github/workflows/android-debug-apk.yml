name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-stream-server:
    name: Build Stream Server armeabi-v7a
    runs-on: ubuntu-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout stream-server
        uses: actions/checkout@v4
        with:
          repository: perpetus/stream-server
          ref: 368666eb09f9c4849a7df7f2a6a8b26171f24cfb
          path: stream-server

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Export GitHub Actions cache environment for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg_installed-armeabi-v7a
          key: android-vcpkg-arm-android-${{ hashFiles('stream-server/vcpkg.json') }}
          restore-keys: |
            android-vcpkg-arm-android-

      - name: Create Android vcpkg triplet
        run: |
          mkdir -p stream-server/triplets
          cat > stream-server/triplets/arm-android.cmake << 'EOF'
          set(VCPKG_TARGET_ARCHITECTURE arm)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME Android)
          set(VCPKG_CMAKE_SYSTEM_VERSION 24)
          set(VCPKG_MAKE_BUILD_TRIPLET "--host=armv7a-linux-androideabi")
          set(VCPKG_CMAKE_CONFIGURE_OPTIONS -DANDROID_ABI=armeabi-v7a -DANDROID_ARM_NEON=ON)
          EOF

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "84bab45d415d22042bd0b9081aea57f362da3f35"
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          vcpkgJsonGlob: "stream-server/vcpkg.json"
          runVcpkgInstall: false

      - name: Install vcpkg dependencies
        working-directory: stream-server
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet arm-android \
            --x-install-root=${{ github.workspace }}/vcpkg_installed-armeabi-v7a \
            --overlay-triplets=triplets \
            --overlay-ports=vcpkg-overlays
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Verify vcpkg OpenSSL files
        run: |
          test -d "${{ github.workspace }}/vcpkg_installed-armeabi-v7a/arm-android/include/openssl"
          test -d "${{ github.workspace }}/vcpkg_installed-armeabi-v7a/arm-android/lib"

      - name: Build stream-server for armeabi-v7a
        working-directory: stream-server/server
        run: cargo ndk --target armv7-linux-androideabi --platform 24 build --release --features libtorrent --no-default-features
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed-armeabi-v7a
          VCPKGRS_TRIPLET: arm-android
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed-armeabi-v7a/arm-android/lib/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ${{ github.workspace }}/vcpkg_installed-armeabi-v7a/arm-android
          OPENSSL_DIR: ${{ github.workspace }}/vcpkg_installed-armeabi-v7a/arm-android

      - name: Prepare JNI library artifact
        run: |
          mkdir -p jniLibs/armeabi-v7a
          cp stream-server/target/armv7-linux-androideabi/release/libstream_server.so jniLibs/armeabi-v7a/

      - name: Upload JNI library artifact
        uses: actions/upload-artifact@v4
        with:
          name: stream-server-jniLibs-armeabi-v7a
          path: jniLibs/

  debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: build-stream-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download stream-server JNI library
        uses: actions/download-artifact@v4
        with:
          name: stream-server-jniLibs-armeabi-v7a
          path: app/src/main/jniLibs/

      - name: Verify JNI library
        run: test -f app/src/main/jniLibs/armeabi-v7a/libstream_server.so

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --warning-mode all

      - name: Verify debug APK outputs
        run: python .github/scripts/verify-apk-outputs.py app/build/outputs/apk/debug armeabi-v7a arm64-v8a x86 x86_64 universal

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stremio-mobile-debug-apk-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14
